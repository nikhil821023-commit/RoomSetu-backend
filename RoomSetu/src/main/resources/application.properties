
# ==========================================
# SERVER
# ==========================================
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roomsetu}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
  
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
  
  
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
  
  
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
  

roomsetu.mail.enabled=${ROOMSETU_MAIL_ENABLED:false}
roomsetu.mail.provider=${MAIL_PROVIDER:smtp}
roomsetu.mail.from=${MAIL_FROM:}
roomsetu.mail.from-name=RoomSetu
roomsetu.mail.brevo.api-key=${BREVO_API_KEY:}
  

roomsetu.otp.expiry-seconds=${OTP_EXPIRY_SECONDS:300}
roomsetu.otp.console-fallback=${OTP_CONSOLE_FALLBACK:true}

roomsetu.jwt.secret=${ROOMSETU_JWT_SECRET}
roomsetu.jwt.expiration-ms=${ROOMSETU_JWT_EXPIRATION_MS:86400000}
  
  
roomsetu.sms.enabled=${ROOMSETU_SMS_ENABLED:false}
roomsetu.sms.provider=${SMS_PROVIDER:fast2sms}
roomsetu.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
roomsetu.sms.msg91.api-key=${MSG91_API_KEY:}

roomsetu.cors.allowed-origin-patterns=${ROOMSETU_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}


roomsetu.ai.enabled=${ROOMSETU_AI_ENABLED:false}

  
  # ==========================================

